<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f0d"/>
      <stop offset="100%" stop-color="#040605"/>
    </linearGradient>
    <linearGradient id="neonG2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardG2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15221c"/>
      <stop offset="100%" stop-color="#0d1612"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgG2)"/>
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="#00ff88" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Browser Header -->
  <rect x="0" y="0" width="800" height="44" rx="16" fill="#101714"/>
  <circle cx="28" cy="22" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="44" cy="22" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="60" cy="22" r="5" fill="#10b981" opacity="0.8"/>
  
  <rect x="100" y="12" width="460" height="20" rx="10" fill="#090d0b" stroke="#1d2e25" stroke-width="1"/>
  <text x="330" y="26" font-family="'Cairo', sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle">fashion-store.preview / Clothing Store Concept</text>

  <rect x="660" y="12" width="115" height="20" rx="10" fill="#00ff88" fill-opacity="0.15" stroke="#00ff88" stroke-width="0.8"/>
  <text x="717" y="26" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" fill="#00ff88" text-anchor="middle">متجر أزياء متكامل</text>

  <!-- Store Navigation Bar -->
  <rect x="30" y="60" width="740" height="50" rx="12" fill="#111c16" stroke="#1d2e25" stroke-width="1"/>
  <text x="50" y="91" font-family="'Cairo', sans-serif" font-size="17" font-weight="900" fill="#00ff88" filter="url(#glow2)">NOIR</text>
  <text x="100" y="91" font-family="'Cairo', sans-serif" font-size="13" font-weight="700" fill="#e5e7eb">APPAREL</text>

  <!-- Categories: Men, Women, Kids -->
  <rect x="230" y="70" width="75" height="30" rx="6" fill="#00ff88" fill-opacity="0.18" stroke="#00ff88" stroke-width="1"/>
  <text x="267" y="90" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#00ff88" text-anchor="middle">رجالي</text>
  
  <text x="345" y="90" font-family="'Cairo', sans-serif" font-size="12" fill="#9ca3af">حريمي</text>
  <text x="425" y="90" font-family="'Cairo', sans-serif" font-size="12" fill="#9ca3af">أطفال</text>
  <text x="500" y="90" font-family="'Cairo', sans-serif" font-size="12" fill="#9ca3af">العروض %</text>

  <!-- Login & Cart -->
  <text x="610" y="90" font-family="'Cairo', sans-serif" font-size="12" fill="#9ca3af">تسجيل دخول</text>
  <rect x="680" y="70" width="75" height="30" rx="8" fill="url(#neonG2)"/>
  <text x="717" y="90" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#050807" text-anchor="middle">السلة (2)</text>

  <!-- Store Promo Banner -->
  <g transform="translate(30, 125)">
    <rect width="740" height="120" rx="14" fill="url(#cardG2)" stroke="#1c2d24" stroke-width="1"/>
    <circle cx="700" cy="60" r="70" fill="#00ff88" opacity="0.08" filter="url(#glow2)"/>

    <rect x="30" y="22" width="90" height="22" rx="11" fill="#00ff88" fill-opacity="0.2"/>
    <text x="75" y="37" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" fill="#00ff88" text-anchor="middle">مجموعة شتاء 2026</text>

    <text x="30" y="75" font-family="'Cairo', sans-serif" font-size="20" font-weight="900" fill="#f1f5f4">تشكيلة ملابس كاجوال ورسمية بتصاميم استثنائية</text>
    <text x="30" y="102" font-family="'Cairo', sans-serif" font-size="12" fill="#94a3a0">تصفح أقسام الرجال والنساء والأطفال مع شحن سريع وخيارات دفع متعددة ولوحة إدارة للمنتجات</text>

    <!-- Admin dashboard badge -->
    <rect x="580" y="25" width="135" height="28" rx="6" fill="#0c1410" stroke="#00ff88" stroke-width="0.8"/>
    <text x="647" y="43" font-family="'Cairo', sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle">⚡ لوحة إدارة متضمنة</text>
  </g>

  <!-- Product Grid -->
  <!-- Product 1 -->
  <g transform="translate(30, 260)">
    <rect width="233" height="215" rx="12" fill="url(#cardG2)" stroke="#1e2e26" stroke-width="1"/>
    <rect x="12" y="12" width="209" height="105" rx="8" fill="#18241f"/>
    <!-- Icon representing fashion jacket -->
    <circle cx="116" cy="65" r="32" fill="#00ff88" fill-opacity="0.1" stroke="#00ff88" stroke-opacity="0.25"/>
    <text x="116" y="72" font-size="30" text-anchor="middle">🧥</text>
    <text x="25" y="32" font-family="'Cairo', sans-serif" font-size="10" fill="#6ee7b7">قسم الرجالي</text>

    <text x="15" y="140" font-family="'Cairo', sans-serif" font-size="13" font-weight="bold" fill="#f1f5f4">جاكيت هودي شتوي أسود</text>
    <text x="15" y="160" font-family="'Cairo', sans-serif" font-size="11" fill="#889692">خامات قطنية مع بطانة دافئة</text>
    
    <!-- Sizes -->
    <text x="15" y="180" font-family="'Cairo', sans-serif" font-size="10" fill="#6ee7b7">المقاسات: M - L - XL</text>

    <text x="15" y="202" font-family="'Cairo', sans-serif" font-size="15" font-weight="900" fill="#00ff88">650 ج.م</text>
    <rect x="145" y="182" width="76" height="26" rx="6" fill="#00ff88" fill-opacity="0.15" stroke="#00ff88" stroke-width="1"/>
    <text x="183" y="199" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" fill="#00ff88" text-anchor="middle">أضف للسلة</text>
  </g>

  <!-- Product 2 -->
  <g transform="translate(283, 260)">
    <rect width="233" height="215" rx="12" fill="url(#cardG2)" stroke="#1e2e26" stroke-width="1"/>
    <rect x="12" y="12" width="209" height="105" rx="8" fill="#18241f"/>
    <circle cx="116" cy="65" r="32" fill="#00ff88" fill-opacity="0.1" stroke="#00ff88" stroke-opacity="0.25"/>
    <text x="116" y="72" font-size="30" text-anchor="middle">👗</text>
    <text x="25" y="32" font-family="'Cairo', sans-serif" font-size="10" fill="#6ee7b7">قسم الحريمي</text>

    <text x="15" y="140" font-family="'Cairo', sans-serif" font-size="13" font-weight="bold" fill="#f1f5f4">فستان ميدي كاجوال أنيق</text>
    <text x="15" y="160" font-family="'Cairo', sans-serif" font-size="11" fill="#889692">تصميم عصري مناسب للإطلالات اليومية</text>
    <text x="15" y="180" font-family="'Cairo', sans-serif" font-size="10" fill="#6ee7b7">المقاسات: S - M - L</text>

    <text x="15" y="202" font-family="'Cairo', sans-serif" font-size="15" font-weight="900" fill="#00ff88">890 ج.م</text>
    <rect x="145" y="182" width="76" height="26" rx="6" fill="#00ff88" fill-opacity="0.15" stroke="#00ff88" stroke-width="1"/>
    <text x="183" y="199" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" fill="#00ff88" text-anchor="middle">أضف للسلة</text>
  </g>

  <!-- Product 3 -->
  <g transform="translate(537, 260)">
    <rect width="233" height="215" rx="12" fill="url(#cardG2)" stroke="#1e2e26" stroke-width="1"/>
    <rect x="12" y="12" width="209" height="105" rx="8" fill="#18241f"/>
    <circle cx="116" cy="65" r="32" fill="#00ff88" fill-opacity="0.1" stroke="#00ff88" stroke-opacity="0.25"/>
    <text x="116" y="72" font-size="30" text-anchor="middle">👕</text>
    <text x="25" y="32" font-family="'Cairo', sans-serif" font-size="10" fill="#6ee7b7">قسم الأطفال</text>

    <text x="15" y="140" font-family="'Cairo', sans-serif" font-size="13" font-weight="bold" fill="#f1f5f4">سويت شيرت أطفال مطبوع</text>
    <text x="15" y="160" font-family="'Cairo', sans-serif" font-size="11" fill="#889692">قطن 100% ناعم ومريح للأعمار 4-12</text>
    <text x="15" y="180" font-family="'Cairo', sans-serif" font-size="10" fill="#6ee7b7">الأعمار: 4 - 6 - 8 - 10 - 12</text>

    <text x="15" y="202" font-family="'Cairo', sans-serif" font-size="15" font-weight="900" fill="#00ff88">420 ج.م</text>
    <rect x="145" y="182" width="76" height="26" rx="6" fill="#00ff88" fill-opacity="0.15" stroke="#00ff88" stroke-width="1"/>
    <text x="183" y="199" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" fill="#00ff88" text-anchor="middle">أضف للسلة</text>
  </g>
</svg>

