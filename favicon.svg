<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00a854" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0b100e" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Futuristic Y / W Monogram -->
  <path d="M18 16 L32 34 L46 16" fill="none" stroke="url(#neonGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M32 34 L32 48" fill="none" stroke="url(#neonGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="32" cy="49" r="2.5" fill="#00ff88" />
  <circle cx="18" cy="16" r="2" fill="#00ff88" />
  <circle cx="46" cy="16" r="2" fill="#00ff88" />
</svg>

